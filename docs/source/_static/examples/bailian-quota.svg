<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="727" viewBox="0 0 2048 727" role="img" aria-labelledby="title desc">
  <title id="title">MaxCompute model compute service and inference quota page</title>
  <desc id="desc">A vector illustration of the MaxCompute model compute service purchase page with model compute service, region, inference quota, and agreement selections.</desc>
  <defs>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; fill: #2f3640; }
      .title { font-size: 24px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 700; }
      .body { font-size: 16px; }
      .muted { fill: #737f8c; }
      .link { fill: #0070d9; }
      .tab { fill: #ffffff; stroke: #d8dde3; stroke-width: 1.5; }
      .tab-active { fill: #e6f4ff; stroke: #9cccff; stroke-width: 1.5; }
      .panel { fill: #ffffff; }
      .badge { fill: #ff7a1a; }
    </style>
  </defs>

  <rect width="2048" height="727" fill="#f2f3f5"/>
  <g class="font">
    <text x="19" y="53" class="title">MaxCompute Model Compute Service</text>

    <rect x="19" y="68" width="1998" height="168" class="panel"/>
    <rect x="93" y="96" width="1854" height="101" fill="#eaf6ff"/>
    <rect x="126" y="108" width="116" height="34" fill="#dff1ff"/>
    <text x="143" y="130" class="body link" font-weight="700">Purchase info</text>
    <rect x="126" y="151" width="116" height="34" fill="#dff1ff"/>
    <text x="143" y="182" class="body link" font-weight="700">Billing rules</text>
    <text x="258" y="130" class="body">After activation, you can use MaxCompute large-model inference for data labeling, vectorization, information extraction, and other data processing tasks.</text>
    <text x="258" y="154" class="body">Enable it once per region; billing is based on actual model usage.</text>
    <text x="258" y="182" class="body">Model inference fees depend on region, model, and input/output tokens. See</text>
    <text x="814" y="182" class="body link">Billing documentation</text>

    <rect x="19" y="249" width="1998" height="100" class="panel"/>
    <text x="60" y="311" class="label">Product type</text>
    <g class="body" text-anchor="middle">
      <rect x="279" y="278" width="130" height="44" class="tab"/>
      <text x="344" y="306">Subscription</text>
      <rect x="420" y="278" width="145" height="44" class="tab"/>
      <text x="493" y="306">Pay-as-you-go</text>
      <rect x="576" y="278" width="200" height="44" class="tab"/>
      <text x="669" y="306">AI compute resources</text>
      <circle cx="758" cy="300" r="12" class="badge"/>
      <text x="758" y="305" font-size="10" fill="#ffffff">New</text>
      <rect x="788" y="278" width="235" height="44" class="tab-active"/>
      <text x="903" y="306">Model compute service</text>
      <circle cx="1004" cy="300" r="12" class="badge"/>
      <text x="1004" y="305" font-size="10" fill="#ffffff">New</text>
      <rect x="1035" y="278" width="225" height="44" class="tab"/>
      <text x="1148" y="306">Pay-as-you-go off-peak</text>
      <rect x="1272" y="278" width="190" height="44" class="tab"/>
      <text x="1367" y="306">Compute savings plan</text>
      <rect x="1474" y="278" width="190" height="44" class="tab"/>
      <text x="1569" y="306">Storage savings plan</text>
      <rect x="1676" y="278" width="190" height="44" class="tab"/>
      <text x="1771" y="306">Discount package</text>
    </g>

    <rect x="19" y="363" width="1998" height="332" class="panel"/>
    <text x="60" y="423" class="label">Region</text>
    <g class="body" text-anchor="middle">
      <rect x="279" y="391" width="208" height="44" class="tab"/>
      <text x="383" y="419">North China 2 (Beijing)</text>
      <rect x="499" y="391" width="209" height="44" class="tab"/>
      <text x="604" y="419">East China 2 (Shanghai)</text>
      <rect x="720" y="391" width="209" height="44" class="tab"/>
      <text x="825" y="419">East China 1 (Hangzhou)</text>
      <rect x="941" y="391" width="209" height="44" class="tab"/>
      <text x="1046" y="419">South China 1 (Shenzhen)</text>
      <rect x="1162" y="391" width="209" height="44" class="tab-active"/>
      <text x="1267" y="419">North China 6 (Ulanqab)</text>
      <rect x="1383" y="391" width="208" height="44" class="tab"/>
      <text x="1487" y="419">Singapore</text>
    </g>

    <text x="60" y="496" class="label">Spec type</text>
    <rect x="279" y="462" width="208" height="44" class="tab-active"/>
    <text x="383" y="490" class="body" text-anchor="middle">Inference Quota</text>
    <text x="279" y="538" class="body muted">After activation, the system creates and associates an Inference Quota for you.</text>
    <text x="279" y="562" class="body muted">You can then use MaxCompute large-model inference in the selected region; the service is pay-as-you-go and billed hourly.</text>

    <text x="60" y="660" class="label">Agreement</text>
    <text x="279" y="660" class="body">By purchasing, you acknowledge and agree to the</text>
    <text x="658" y="660" class="body link">Product Service Agreement</text>
    <text x="858" y="660" class="body">,</text>
    <text x="878" y="660" class="body link">Service Level Agreement</text>
    <text x="1060" y="660" class="body">, and any selected product-specific terms.</text>
  </g>
</svg>
